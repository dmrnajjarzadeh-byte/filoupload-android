name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Cordova
        run: npm install -g cordova
        
      - name: Create Project
        run: |
          cordova create app com.filoupload.app "فایلو آپلود"
          cd app
          cordova platform add android
          
      - name: Configure App
        run: |
          cd app
          sed -i 's|content src="index.html"|content src="https://filoupload.ir"|' config.xml
          
      - name: Generate Icon
        run: |
          cd app
          mkdir -p res/icon/android
          for size in 36 48 72 96 144 192; do
            convert -size ${size}x${size} xc:#667eea -pointsize $((size/2)) -fill white -gravity center -annotate +0+0 "F" res/icon/android/icon-${size}.png
          done
          
      - name: Build Release
        run: |
          cd app
          cordova build android --release
          
      - name: Sign APK
        run: |
          cd app
          keytool -genkey -v -keystore my.keystore -alias key -keyalg RSA -keysize 2048 -validity 9125 -dname "CN=Filoupload" -storepass 123456 -keypass 123456
          apksigner=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -1)
          $apksigner sign --ks my.keystore --ks-pass pass:123456 --key-pass pass:123456 --in platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk --out filoupload.apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: filoupload-apk
          path: app/filoupload.apk
