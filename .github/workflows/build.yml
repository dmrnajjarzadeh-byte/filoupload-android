name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Setup Project & Install Capacitor
        run: |
          # ساخت پروژه npm
          npm init -y
          
          # نصب لوکال Capacitor + Android
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # ساخت پوشه www
          mkdir -p www
          echo '<html><body style="background:#0f0818"></body></html>' > www/index.html
          
          # کانفیگ Capacitor
          npx cap init "فایلو آپلود" com.filoupload.app --web-dir www
          
          # اضافه کردن اندروید
          npx cap add android
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: filoupload-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
