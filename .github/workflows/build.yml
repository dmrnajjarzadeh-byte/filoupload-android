name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Create Capacitor Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          echo '<html><body style="background:#0f0818"></body></html>' > www/index.html
          
          # ساخت کانفیگ با آدرس سایت
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.filoupload.app",
            "appName": "فایلو آپلود",
            "webDir": "www",
            "server": {
              "url": "https://filoupload.ir",
              "cleartext": false,
              "allowNavigation": ["*.filoupload.ir", "github.com", "*.github.com", "s1.mediaad.org", "*.mediaad.org"]
            },
            "android": {
              "allowMixedContent": false
            }
          }
          EOF
          
          npx cap add android
          
      - name: Fix Kotlin Conflict
        run: |
          printf "\nconfigurations.all {\n    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\n    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\n}\n" >> android/app/build.gradle
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: filoupload-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
