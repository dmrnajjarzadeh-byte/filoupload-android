name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Cordova & Build APK
        run: |
          npm install -g cordova
          
          # ساخت پروژه
          cordova create filoupload-app com.filoupload.app "فایلو آپلود"
          cd filoupload-app
          
          # اضافه کردن اندروید
          cordova platform add android
          
          # تغییر صفحه شروع به سایتت
          sed -i 's|<content src="index.html" />|<content src="https://filoupload.ir" />|' config.xml
          
          # اضافه کردن دسترسی‌های لازم توی config.xml
          sed -i 's|</widget>|  <allow-navigation href="https://filoupload.ir/*" />\n  <allow-navigation href="https://github.com/*" />\n  <allow-navigation href="https://*.mediaad.org/*" />\n  <allow-navigation href="https://s1.mediaad.org/*" />\n  <access origin="*" />\n  <preference name="AndroidInsecureFileModeEnabled" value="false" />\n</widget>|' config.xml
          
          # Build
          cordova build android
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: filoupload-apk
          path: filoupload-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
