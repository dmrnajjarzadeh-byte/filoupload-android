name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          
      - name: Create Android Project
        run: |
          mkdir -p myapp/app/src/main/java/com/filoupload/app
          mkdir -p myapp/app/src/main/res/layout
          mkdir -p myapp/app/src/main/res/values
          
          cat > myapp/settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FilouploadApp"
          include ':app'
          EOF
          
          cat > myapp/build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF
          
          cat > myapp/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF
          
          cat > myapp/app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'com.filoupload.app'
              compileSdk 34
              
              defaultConfig {
                  applicationId "com.filoupload.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
          }
          
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
          }
          EOF
          
          cat > myapp/app/proguard-rules.pro << 'EOF'
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          EOF
          
          mkdir -p myapp/app/src/main
          cat > myapp/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.Filoupload"
                  android:usesCleartextTraffic="false"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          cat > myapp/app/src/main/java/com/filoupload/app/MainActivity.java << 'EOF'
          package com.filoupload.app;
          
          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.ClipData;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ProgressBar;
          import android.widget.Toast;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          
          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private SwipeRefreshLayout swipeRefresh;
              private ProgressBar progressBar;
              private ValueCallback<Uri[]> filePathCallback;
              private static final String SITE_URL = "https://filoupload.ir/";
              private static final int REQUEST_PERMISSIONS = 1001;
              private boolean pageLoaded = false;
          
              private final ActivityResultLauncher<Intent> fileChooserLauncher = registerForActivityResult(
                      new ActivityResultContracts.StartActivityForResult(),
                      result -> {
                          if (filePathCallback == null) return;
                          Uri[] results = null;
                          if (result.getResultCode() == Activity.RESULT_OK && result.getData() != null) {
                              String dataString = result.getData().getDataString();
                              ClipData clipData = result.getData().getClipData();
                              if (clipData != null) {
                                  results = new Uri[clipData.getItemCount()];
                                  for (int i = 0; i < clipData.getItemCount(); i++) {
                                      results[i] = clipData.getItemAt(i).getUri();
                                  }
                              } else if (dataString != null) {
                                  results = new Uri[]{Uri.parse(dataString)};
                              }
                          }
                          filePathCallback.onReceiveValue(results);
                          filePathCallback = null;
                      }
              );
          
              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS, WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS);
                  setContentView(R.layout.activity_main);
                  checkPermissions();
                  initViews();
                  setupWebView();
              }
          
              private void checkPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      String[] permissions = {
                          Manifest.permission.READ_MEDIA_IMAGES,
                          Manifest.permission.READ_MEDIA_VIDEO,
                          Manifest.permission.READ_MEDIA_AUDIO
                      };
                      boolean needRequest = false;
                      for (String perm : permissions) {
                          if (ContextCompat.checkSelfPermission(this, perm) != PackageManager.PERMISSION_GRANTED) {
                              needRequest = true;
                              break;
                          }
                      }
                      if (needRequest) {
                          ActivityCompat.requestPermissions(this, permissions, REQUEST_PERMISSIONS);
                      }
                  } else if (Build.VERSION.SDK_INT <= Build.VERSION_CODES.P) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE, Manifest.permission.READ_EXTERNAL_STORAGE}, REQUEST_PERMISSIONS);
                      }
                  }
              }
          
              private void initViews() {
                  webView = findViewById(R.id.webView);
                  swipeRefresh = findViewById(R.id.swipeRefresh);
                  progressBar = findViewById(R.id.progressBar);
                  swipeRefresh.setColorSchemeResources(android.R.color.holo_purple, android.R.color.holo_blue_light, android.R.color.holo_green_light);
                  swipeRefresh.setOnRefreshListener(() -> {
                      webView.reload();
                  });
              }
          
              @SuppressLint("SetJavaScriptEnabled")
              private void setupWebView() {
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportMultipleWindows(true);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  
                  String originalUA = settings.getUserAgentString();
                  settings.setUserAgentString(originalUA + " FilouploadAndroid/1.0 Mobile");
                  
                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  cookieManager.setAcceptThirdPartyCookies(webView, true);
          
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  webView.setBackgroundColor(0x00000000);
          
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);
                          progressBar.setVisibility(View.VISIBLE);
                          pageLoaded = false;
                      }
          
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          progressBar.setVisibility(View.GONE);
                          swipeRefresh.setRefreshing(false);
                          pageLoaded = true;
                      }
          
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          super.onReceivedError(view, request, error);
                          if (request.isForMainFrame()) {
                              Toast.makeText(MainActivity.this, "خطا در لود صفحه: " + error.getDescription(), Toast.LENGTH_LONG).show();
                          }
                      }
          
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("https://filoupload.ir") || 
                              url.startsWith("https://github.com") || 
                              url.startsWith("https://api.github.com") ||
                              url.contains("mediaad.org") ||
                              url.startsWith("https://s1.mediaad.org")) {
                              return false;
                          }
                          Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                          startActivity(intent);
                          return true;
                      }
                  });
          
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          progressBar.setProgress(newProgress);
                      }
          
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (MainActivity.this.filePathCallback != null) {
                              MainActivity.this.filePathCallback.onReceiveValue(null);
                          }
                          MainActivity.this.filePathCallback = filePathCallback;
                          Intent intent = fileChooserParams.createIntent();
                          try {
                              fileChooserLauncher.launch(intent);
                          } catch (Exception e) {
                              MainActivity.this.filePathCallback = null;
                              Toast.makeText(MainActivity.this, "خطا در باز کردن انتخابگر فایل", Toast.LENGTH_SHORT).show();
                              return false;
                          }
                          return true;
                      }
                  });
          
                  webView.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) -> {
                      DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                      request.setMimeType(mimeType);
                      request.addRequestHeader("User-Agent", userAgent);
                      request.setDescription("در حال دانلود...");
                      request.setTitle(android.webkit.URLUtil.guessFileName(url, contentDisposition, mimeType));
                      request.allowScanningByMediaScanner();
                      request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, android.webkit.URLUtil.guessFileName(url, contentDisposition, mimeType));
                      DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                      if (dm != null) {
                          dm.enqueue(request);
                          Toast.makeText(MainActivity.this, "دانلود شروع شد", Toast.LENGTH_SHORT).show();
                      }
                  });
          
                  webView.loadUrl(SITE_URL);
          
                  // اگه ۸ ثانیه لود نشد، رفرش خودکار
                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      if (!pageLoaded) {
                          Toast.makeText(MainActivity.this, "صفحه دیر لود می‌شه... دوباره تلاش می‌کنم", Toast.LENGTH_SHORT).show();
                          webView.stopLoading();
                          webView.loadUrl(SITE_URL);
                      }
                  }, 8000);
              }
          
              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          
              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.loadUrl("about:blank");
                      webView.removeAllViews();
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF
          
          cat > myapp/app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.swiperefreshlayout.widget.SwipeRefreshLayout 
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/swipeRefresh"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
          
              <FrameLayout
                  android:layout_width="match_parent"
                  android:layout_height="match_parent">
          
                  <WebView
                      android:id="@+id/webView"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent" />
          
                  <ProgressBar
                      android:id="@+id/progressBar"
                      style="@style/Widget.AppCompat.ProgressBar.Horizontal"
                      android:layout_width="match_parent"
                      android:layout_height="3dp"
                      android:layout_gravity="top"
                      android:progressDrawable="@drawable/progress_gradient"
                      android:visibility="visible" />
          
              </FrameLayout>
          </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>
          EOF
          
          mkdir -p myapp/app/src/main/res/drawable
          cat > myapp/app/src/main/res/drawable/progress_gradient.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@android:id/background">
                  <shape>
                      <solid android:color="@android:color/transparent" />
                  </shape>
              </item>
              <item android:id="@android:id/progress">
                  <clip>
                      <shape>
                          <gradient
                              android:startColor="#667eea"
                              android:endColor="#38ef7d"
                              android:angle="0" />
                      </shape>
                  </clip>
              </item>
          </layer-list>
          EOF
          
          cat > myapp/app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">فایلو آپلود</string>
          </resources>
          EOF
          
          cat > myapp/app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="Theme.Filoupload" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">#0f0818</item>
                  <item name="android:windowBackground">#0f0818</item>
              </style>
          </resources>
          EOF
          
          cat > myapp/app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="filoupload_dark">#0f0818</color>
          </resources>
          EOF
          
      - name: Generate Gradle Wrapper
        run: |
          cd myapp
          gradle wrapper --gradle-version 8.5
          
      - name: Build APK
        run: |
          cd myapp
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: filoupload-apk
          path: myapp/app/build/outputs/apk/debug/app-debug.apk
